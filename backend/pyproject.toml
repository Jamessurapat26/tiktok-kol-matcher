[project]
name = "backend"
version = "0.1.0"
description = "TikTok KOL matcher for Thai brands (LangGraph pipeline)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.17",
    "pydantic>=2.14.1",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
