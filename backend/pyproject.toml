[project]
name = "backend"
version = "0.1.0"
description = "TikTok KOL matcher for Thai brands (LangGraph pipeline)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx[brotli,http2]>=0.28.1",
    "langgraph>=1.2.17",
    "openai>=3.39.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

# Local embeddinggemma. Not installed by `uv sync`.
# `uv sync --extra embed` pulls sentence-transformers and the CPU torch build.
[project.optional-dependencies]
embed = [
    "sentence-transformers>=6.1.0",
    "transformers>=4.57.0",
    # The model's processor config names image and video processors. They need
    # Pillow and torchvision to import even though only text is embedded.
    "pillow>=10.0.0",
    "torchvision>=0.21.0",
    "torch>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "embed" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "embed" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
