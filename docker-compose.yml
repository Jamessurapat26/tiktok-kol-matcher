services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_EMBED: "false"
    ports:
      # Loopback only: the API has no authentication.
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Container paths win over any local paths in .env.
      KOL_CACHE_DIR: /app/data/cache
      JOBS_DB: /app/data/jobs.db
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # frontend:
