server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolve the backend per request, so a recreated container's new address is used.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Server-sent events: pass each event through as it is written.
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # File names carry a content hash. `expires` keeps the add_header set above,
    # where a location-level add_header would drop it.
    location /assets/ {
        expires 1y;
    }

    # index.html names the current hashes, so clients revalidate it every time.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
